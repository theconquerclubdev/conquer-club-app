name: conquer_club
description: A Flutter fitness app for tracking workouts and diet.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # PDF
  pdf: ^3.10.0
  printing: ^5.11.0

  # UI & Utilities
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  fl_chart: ^0.68.0

  # Supabase
  supabase_flutter: ^2.15.4

  # Other packages
  app_links: ^6.4.1
  url_launcher: ^6.3.0
  pedometer: ^4.0.2
  permission_handler: ^11.3.1
  share_plus: ^10.1.3

  # Local storage
  shared_preferences: ^2.3.2

  # Health data (for step counter)
  health: ^11.1.1

  # Image and file handling (for progress photos)
  http: ^1.2.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1
  open_file: ^3.5.10
  file_picker: ^8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/reel_background.png